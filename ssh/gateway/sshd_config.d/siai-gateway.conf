# ==============================================================================
# SIAI 2026/2027 - SSH Gateway Configuration
# File: /etc/ssh/sshd_config.d/siai-gateway.conf
# Target Host: gw.port.dom.pt (ssh.dom.pt)
# ==============================================================================

# Enable TCP Port Forwarding for jump host usage (ssh -J)
AllowTcpForwarding yes

# Keep proxy connections responsive
ClientAliveInterval 300
ClientAliveCountMax 3

# Allow Agent Forwarding
AllowAgentForwarding yes

# Public Key Authentication enabled
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
