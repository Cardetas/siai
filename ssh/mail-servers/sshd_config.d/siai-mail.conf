# ==============================================================================
# SIAI 2026/2027 - Mail Server OpenSSH Configuration
# File: /etc/ssh/sshd_config.d/siai-mail.conf
# Target Hosts: mail.port.dom.pt (172.16.20.20) and smtp2.usa.dom.pt (172.16.40.20)
# ==============================================================================

# 1. Disable Password Authentication (Mandatory: Public Key Only)
PasswordAuthentication no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no

# 2. Disable Direct Root Login (Mandatory)
PermitRootLogin no

# 3. Enable Public Key Authentication
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys

# 4. Group Access Restriction (Mandatory: Only LDAP managers allowed)
# Developers, regular users, and any other groups are refused!
AllowGroups managers

# 5. Gateway Restriction (Mandatory: SSH connections only accepted from ssh.dom.pt)
# IPs belonging to gw.port.dom.pt (ssh.dom.pt):
#   - 172.16.20.1  (PORT DMZ interface)
#   - 10.10.254.1  (Interconnection interface to USA)
#   - 10.10.20.1   (PORT internal interface)
#   - 127.0.0.1    (Localhost)
Match Address *,!172.16.20.1,!10.10.254.1,!10.10.20.1,!127.0.0.1
    DenyUsers *
