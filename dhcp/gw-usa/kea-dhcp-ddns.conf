{
"DhcpDdns": {
    "ip-address": "127.0.0.1",
    "port": 53001,
    "dns-server-timeout": 1000,

    // TSIG Key shared with BIND9 for authenticated updates
    "tsig-keys": [
        {
            "name": "tsig-key",
            "algorithm": "hmac-sha256",
            "secret": "1FU5hD7faYaajQCjSdA54JkTPQxbbPrRnzOKqHcD9cM="
        }
    ],

    // Forward DDNS Zones for USA
    "forward-ddns": {
        "ddns-domains": [
            {
                "name": "usa.dom.pt.",
                "key-name": "tsig-key",
                "dns-servers": [
                    {
                        // Master DNS Server (dns1.dom.pt)
                        "ip-address": "10.10.254.1",
                        "port": 53
                    }
                ]
            }
        ]
    },

    // Reverse DDNS Zones for USA subnets
    "reverse-ddns": {
        "ddns-domains": [
            {
                // Reverse zone for USA Internal (10.10.40.0/24)
                "name": "40.10.in-addr.arpa.",
                "key-name": "tsig-key",
                "dns-servers": [
                    {
                        "ip-address": "10.10.254.1",
                        "port": 53
                    }
                ]
            },
            {
                // Reverse zone for USA DMZ (172.16.40.0/24)
                "name": "40.16.172.in-addr.arpa.",
                "key-name": "tsig-key",
                "dns-servers": [
                    {
                        "ip-address": "10.10.254.1",
                        "port": 53
                    }
                ]
            }
        ]
    },

    // Logging Configuration
    "loggers": [
        {
            "name": "kea-dhcp-ddns",
            "output_options": [
                {
                    "output": "/var/log/kea/kea-dhcp-ddns.log",
                    "maxsize": 1048576,
                    "maxver": 4
                }
            ],
            "severity": "INFO",
            "debuglevel": 0
        }
    ]
}
}
