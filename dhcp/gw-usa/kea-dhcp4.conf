{
    "Dhcp4": {
        //  enp0s8 = USA Internal (10.10.40.1), enp0s9 = USA DMZ (172.16.40.1)
        "interfaces-config": {
            "interfaces": [ "enp0s8", "enp0s9" ]
        },

        "lease-database": {
            "type": "memfile",
            "persist": true
        },

        "valid-lifetime": 28800,  // 8 hours
        "renew-timer": 21600,     // 6 hours
        "rebind-timer": 25200,    // 7 hours

        "dhcp-ddns": {
        "enable-updates": true
        },
        "ddns-qualifying-suffix": "usa.dom.pt.",
        "ddns-override-client-update": true,
        "ddns-replace-client-name": "when-not-present",
        "ddns-generated-prefix": "user",

        "subnet4": [
            // USA Internal Subnet (10.10.40.0/24)
            {
                "id": 1,
                "subnet": "10.10.40.0/24",
                "interface": "enp0s8",
                "pools": [
                    {
                        "pool": "10.10.40.100 - 10.10.40.200"
                    }
                ],
                "option-data": [
                    {
                        "name": "routers",
                        "data": "10.10.40.1"
                    },
                    {
                        "name": "domain-name",
                        "data": "usa.dom.pt"
                    },
                    {
                        "name": "domain-name-servers",
                        "data": "10.10.40.1, 10.10.254.1"
                    }
                ]
            },

            // USA DMZ Subnet (172.16.40.0/24)
            {
                "id": 2,
                "subnet": "172.16.40.0/24",
                "interface": "enp0s9",
                "pools": [
                    {
                        "pool": "172.16.40.100 - 172.16.40.150"
                    }
                ],
                "option-data": [
                    {
                        "name": "routers",
                        "data": "172.16.40.1"
                    },
                    {
                        "name": "domain-name",
                        "data": "usa.dom.pt"
                    },
                    {
                        "name": "domain-name-servers",
                        "data": "172.16.40.1, 10.10.254.1"
                    }
                ],
                "reservations": [
                    {
                        "hw-address": "08:00:27:00:40:10",
                        "ip-address": "172.16.40.10",
                        "hostname": "web"
                    },
                    {
                        "hw-address": "08:00:27:00:40:20",
                        "ip-address": "172.16.40.20",
                        "hostname": "smtp2"
                    }
                ]
            }
        ]
    }
}