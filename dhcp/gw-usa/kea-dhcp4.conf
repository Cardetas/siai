{
"Dhcp4": {
    // Interfaces Kea listens on for DHCP requests on gw.usa
    // enp0s8 = USA Internal (10.10.40.1), enp0s9 = USA DMZ (172.16.40.1)
    "interfaces-config": {
        "interfaces": [ "enp0s8", "enp0s9" ]
    },

    // In-memory lease storage written to disk
    "lease-database": {
        "type": "memfile",
        "persist": true,
        "name": "/var/lib/kea/kea-leases4.csv"
    },

    // Lease Timers (Assignment: Valid for 8 hours, Renew after 6 hours)
    "valid-lifetime": 28800,  // 8 hours (8 * 3600s)
    "renew-timer": 21600,     // 6 hours (6 * 3600s)
    "rebind-timer": 36000,    // 10 hours (10 * 3600s)

    // Dynamic DNS integration with kea-dhcp-ddns
    "dhcp-ddns": {
        "enable-updates": true,
        "server-ip": "127.0.0.1",
        "server-port": 53001,
        "sender-ip": "",
        "sender-port": 0,
        "max-queue-size": 1024,
        "ncr-protocol": "UDP",
        "ncr-format": "JSON"
    },
    "ddns-send-updates": true,
    "ddns-qualifying-suffix": "usa.dom.pt",
    "ddns-override-no-update": true,
    "ddns-override-client-update": true,
    "ddns-replace-client-name": "when-not-present",
    "ddns-generated-prefix": "user",

    // Global Option Defaults
    "option-data": [
        {
            "name": "domain-name",
            "data": "usa.dom.pt"
        },
        {
            "name": "domain-name-servers",
            "data": "10.10.254.1, 10.10.40.1"
        }
    ],

    // Subnets Configuration
    "subnet4": [
        // 1. USA Internal Subnet (10.10.40.0/24)
        {
            "id": 1,
            "subnet": "10.10.40.0/24",
            "interface": "enp0s8",
            "pools": [
                {
                    "pool": "10.10.40.100 - 10.10.40.200"
                }
            ],
            "option-data": [
                {
                    "name": "routers",
                    "data": "10.10.40.1"
                },
                {
                    "name": "domain-name",
                    "data": "usa.dom.pt"
                },
                {
                    "name": "domain-name-servers",
                    "data": "10.10.254.1, 10.10.40.1"
                }
            ]
        },

        // 2. USA DMZ Subnet (172.16.40.0/24)
        {
            "id": 2,
            "subnet": "172.16.40.0/24",
            "interface": "enp0s9",
            "pools": [
                {
                    "pool": "172.16.40.100 - 172.16.40.150"
                }
            ],
            "option-data": [
                {
                    "name": "routers",
                    "data": "172.16.40.1"
                },
                {
                    "name": "domain-name",
                    "data": "usa.dom.pt"
                },
                {
                    "name": "domain-name-servers",
                    "data": "10.10.254.1, 172.16.40.1"
                }
            ],
            // Static MAC Reservations for Servers (Assignment Requirement)
            "reservations": [
                {
                    "hw-address": "08:00:27:00:40:10",
                    "ip-address": "172.16.40.10",
                    "hostname": "web.usa.dom.pt"
                },
                {
                    "hw-address": "08:00:27:00:40:20",
                    "ip-address": "172.16.40.20",
                    "hostname": "smtp2.usa.dom.pt"
                }
            ]
        }
    ],

    // Logging Configuration
    "loggers": [
        {
            "name": "kea-dhcp4",
            "output_options": [
                {
                    "output": "/var/log/kea/kea-dhcp4.log",
                    "maxsize": 1048576,
                    "maxver": 4
                }
            ],
            "severity": "INFO",
            "debuglevel": 0
        }
    ]
}
}
