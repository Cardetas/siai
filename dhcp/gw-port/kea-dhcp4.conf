{
"Dhcp4": {
    // Interfaces Kea listens on for DHCP requests
    // enp0s8 = PORT Internal (10.10.20.1), enp0s9 = PORT DMZ (172.16.20.1)
    "interfaces-config": {
        "interfaces": [ "enp0s8", "enp0s9" ]
    },

    // In-memory lease storage written to disk
    "lease-database": {
        "type": "memfile",
        "persist": true,
        "name": "/var/lib/kea/kea-leases4.csv"
    },

    // Lease Timers (Assignment: Valid for 8 hours, Renew after 6 hours)
    "valid-lifetime": 28800,  // 8 hours (8 * 3600s)
    "renew-timer": 21600,     // 6 hours (6 * 3600s)
    "rebind-timer": 36000,    // 10 hours (10 * 3600s)

    // Dynamic DNS integration with kea-dhcp-ddns
    "dhcp-ddns": {
        "enable-updates": true,
        "server-ip": "127.0.0.1",
        "server-port": 53001,
        "sender-ip": "",
        "sender-port": 0,
        "max-queue-size": 1024,
        "ncr-protocol": "UDP",
        "ncr-format": "JSON"
    },
    "ddns-send-updates": true,
    "ddns-qualifying-suffix": "port.dom.pt",
    "ddns-override-no-update": true,
    "ddns-override-client-update": true,
    "ddns-replace-client-name": "when-not-present",
    "ddns-generated-prefix": "user",

    // Global Option Defaults
    "option-data": [
        {
            "name": "domain-name",
            "data": "port.dom.pt"
        },
        {
            "name": "domain-name-servers",
            "data": "10.10.20.1, 10.10.254.2"
        }
    ],

    // Subnets Configuration
    "subnet4": [
        // 1. PORT Internal Subnet (10.10.20.0/24)
        {
            "id": 1,
            "subnet": "10.10.20.0/24",
            "interface": "enp0s8",
            "pools": [
                {
                    "pool": "10.10.20.100 - 10.10.20.200"
                }
            ],
            "option-data": [
                {
                    "name": "routers",
                    "data": "10.10.20.1"
                },
                {
                    "name": "domain-name",
                    "data": "port.dom.pt"
                },
                {
                    "name": "domain-name-servers",
                    "data": "10.10.20.1, 10.10.254.2"
                }
            ]
        },

        // 2. PORT DMZ Subnet (172.16.20.0/24)
        {
            "id": 2,
            "subnet": "172.16.20.0/24",
            "interface": "enp0s9",
            "pools": [
                {
                    "pool": "172.16.20.100 - 172.16.20.150"
                }
            ],
            "option-data": [
                {
                    "name": "routers",
                    "data": "172.16.20.1"
                },
                {
                    "name": "domain-name",
                    "data": "port.dom.pt"
                },
                {
                    "name": "domain-name-servers",
                    "data": "172.16.20.1, 10.10.254.2"
                }
            ],
            // Static MAC Reservations for Servers
            "reservations": [
                {
                    "hw-address": "08:00:27:00:20:10",
                    "ip-address": "172.16.20.10",
                    "hostname": "ldap.port.dom.pt"
                },
                {
                    "hw-address": "08:00:27:00:20:20",
                    "ip-address": "172.16.20.20",
                    "hostname": "mail.port.dom.pt"
                }
            ]
        }
    ],

    // Logging Configuration
    "loggers": [
        {
            "name": "kea-dhcp4",
            "output_options": [
                {
                    "output": "/var/log/kea/kea-dhcp4.log",
                    "maxsize": 1048576,
                    "maxver": 4
                }
            ],
            "severity": "INFO",
            "debuglevel": 0
        }
    ]
}
}
